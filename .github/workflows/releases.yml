name: (A) Create Release
on:
  workflow_dispatch:
  push:
    branches:
      - '**'
      - '!main'
permissions:
  contents: write
jobs:
  release:
    name: Tag code
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '#release')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
      - name: Use Node.js
        uses: actions/setup-node@v6.3.0
        with:
          node-version: '24'
      - name: Create/push release
        run: |
          # Prep Git
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/UCBoulder/dingo.git"
          git config --global user.email "$email"
          git config --global user.name "$username"

          # Fetch all tags and branches
          git fetch --tags --force

          # Skip the main branch entirely
          branch="$GITHUB_REF_NAME"
          if [ "$branch" = "main" ]; then
            echo "Skipping release: 'main' branch is not used for releases."
            exit 0
          fi
          echo "Branch: $branch"

          # Determine the next release tag based on the branch type
          if echo "$branch" | grep -Eq '^[0-9]+\.[0-9]+\.x$'; then
            # Release branch (e.g. 2.0.x -> 2.0.53, 2.0.54, ...)
            prefix="${branch%x}"                       # e.g. "2.0."
            escaped_prefix=$(echo "$prefix" | sed 's/\./\\./g')
            echo "Release branch detected. Version prefix: $prefix"

            current_version=$(git tag -l | grep -E "^${escaped_prefix}[0-9]+$" | sort -V | tail -1)
            echo "Current version: ${current_version:-none}"

            if [ -z "$current_version" ]; then
              next_version="${prefix}0"
              echo "No matching version tag found. Starting with $next_version"
            else
              next_version=$(echo "$current_version" | awk -F. -v OFS=. '{$NF += 1 ; print}')
            fi
          else
            # Development branch (e.g. md-123 -> md-123-1.0, md-123-1.1, ...)
            safe_branch=$(echo "$branch" | tr '/' '-')
            escaped_branch=$(echo "$safe_branch" | sed 's/[.[\*^$]/\\&/g')
            echo "Development branch detected. Tag prefix: ${safe_branch}-1."

            current_version=$(git tag -l | grep -E "^${escaped_branch}-1\.[0-9]+$" | sort -V | tail -1)
            echo "Current version: ${current_version:-none}"

            if [ -z "$current_version" ]; then
              next_version="${safe_branch}-1.0"
              echo "No matching version tag found. Starting with $next_version"
            else
              minor=$(echo "$current_version" | sed -E 's/.*\.([0-9]+)$/\1/')
              next_version="${safe_branch}-1.$((minor + 1))"
            fi
          fi
          echo "Next version will be: $next_version"

          # Get current and latest commit hashes
          current_sha=$(git rev-parse --short HEAD)
          if [ -n "$current_version" ]; then
            latest_tag_sha=$(git rev-list -n 1 "$current_version" 2>/dev/null || echo "none")
          else
            latest_tag_sha="none"
          fi

          # Check if a release for next version already exists
          if git tag | grep -q "^$next_version$"; then
            echo "Error: Tag $next_version already exists!"
            exit 1
          fi

          # Build Theme
          home=$(pwd)
          mkdir -p /tmp/dingo
          cp -R * /tmp/dingo
          cd /tmp/dingo
          npm install
          npm run build
          rm -fR node_modules
          rm -fR package.json
          rm -fR package-lock.json
          rm -fR README.md
          rm -fR screenshot.png
          rm -fR yarn.lock
          rm -fR babel.config.js
          cd ../
          zip -r "dingo-$next_version.zip" dingo
          cd $home

          # Create changelog without affecting release title
          echo '# CHANGELOG' > release.md
          if [ "$latest_tag_sha" != "none" ]; then
            git log --graph --pretty=format:'%Cred%h%Creset -%C(yellow)%d%Creset %s' $latest_tag_sha..$current_sha --no-merges >> release.md
          else
            git log --graph --pretty=format:'%Cred%h%Creset -%C(yellow)%d%Creset %s' --no-merges -n 10 >> release.md
          fi

          # Create release with exact version number as title
          echo "Creating release $next_version..."
          gh release create $next_version "/tmp/dingo-$next_version.zip#Dingo Built Theme" -F release.md --title "$next_version"

          # Clean up
          rm -fR /tmp/dingo
          rm -f /tmp/dingo-*.zip
        env:
          username: ${{ secrets.GIT_USER }}
          email: ${{ secrets.GIT_EMAIL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
